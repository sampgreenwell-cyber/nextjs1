# The pipeline lives in sampgreenwell-cyber/platform-workflows. @v1 picks up non-breaking
# platform fixes automatically; moving to @v2 is a deliberate change in this file.
#
#   pull request   -> build, test, Snyk (code + dependencies); into qa only from dev
#   push to dev    -> the above, then deploy to dev
#   push to qa     -> the above, then deploy to qa after approval (GitHub environment "qa"),
#                     only if the same code is already on dev
#
# Each environment gets its own build (.env.<env> is compiled in). Per-environment Azure settings
# are GitHub environment variables on "dev" and "qa".
name: CI/CD

on:
  push:
    branches: [dev, qa]
  pull_request:
    branches: [dev, qa]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write          # Azure sign-in with OIDC (no stored credentials)
  security-events: write   # Snyk results in the Security tab
  actions: read

jobs:
  pipeline:
    uses: sampgreenwell-cyber/platform-workflows/.github/workflows/bicep-static-web-app.yaml@v1
    with:
      app-name: nextjs1
      release-model: environment-branches
    secrets: inherit
